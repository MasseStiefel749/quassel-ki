quassel:
  intelligence_mode: SMART   # FAST | BALANCED | SMART | MAXIMUM
  sprache: de

hardware:
  auto_detect: true

modelle:
  auto_select: true
  max_modell_gb: null   # null = automatisch aus Hardware-Profil
  rollen:
    fast: ["llama3.1:latest", "llama3.1"]
    coding: ["quassel-ki:latest", "quassel-ki"]
    reasoning: ["quassel-ki:latest", "quassel-ki"]
    vision: ["moondream:latest", "moondream"]
    fallback: ["llama3.1:latest", "llama3.1"]

memory:
  enabled: true
  retrieval: true
  limit_fakten: 8
  chat_archiv_tage: 30   # alte Chats -> chats/archiv (0 = aus, nie löschen)

context:
  adaptive: true
  verlauf_limit: 10
  budgets: {TRIVIAL: 4096, LOW: 4096, MEDIUM: 8192, HIGH: 16384, MAX: 32768}

chat:
  tokens: 400   # Antwortlänge Chat (Schmiede/Agent nutzen eigene Budgets)

ollama:
  keep_alive: 30m
  num_ctx: 8192   # Fallback, wenn context.adaptive aus ist

agent:
  enabled: true
  max_runden: 8
  self_check: true

projekte:
  # Nur diese Ordner werden gescannt (nie der ganze Rechner). Beispiele:
  # - "C:/Users/Marc/Documents/Unreal"
  # - "D:/Projects"
  scan_pfade: []
  tiefe: 2
  min_confidence: 0.8
  max_risk: MEDIUM

safety:
  confirmations: true

speed:
  modus: SMART
